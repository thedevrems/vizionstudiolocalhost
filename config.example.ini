; =============================================================
;  Réglages du kit localhost FiveM
;  1-INSTALLER.bat copie ce fichier en config.ini : c'est config.ini qu'il faut modifier.
;  Ne change que ce qui est après le "=". config.ini n'est jamais envoyé sur Git.
; =============================================================

; ---------- Serveur ----------

; Ta clé de licence Cfx.re (commence par cfxk_) : https://portal.cfx.re
LICENSE_KEY=

; Nom du fichier de config de ta base, dans server-data\
SERVER_CFG=server.cfg

; Version de FXServer : recommended (stable) | latest (la plus récente) | optional
ARTIFACT_CHANNEL=recommended
; Optionnel : lien direct vers un server.zip précis (prioritaire sur ARTIFACT_CHANNEL)
ARTIFACT_URL=

; ---------- Base de données ----------

; xampp  = MySQL de XAMPP (C:\xampp)
; docker = MariaDB dans Docker Desktop (docker-compose.yml)
DB_MODE=

; Vide = reprend le nom indiqué dans ton server.cfg, sinon "fivem"
DB_NAME=
DB_USER=root
; Vide = valeur par défaut : aucun mot de passe pour XAMPP, "fivem" pour Docker
DB_PASSWORD=
DB_PORT=3306

; Dossier d'installation de XAMPP (mode xampp)
XAMPP_PATH=C:\xampp
; Port de phpMyAdmin (mode docker) -> http://localhost:8080
PMA_PORT=8080

; ---------- Options ----------

; true = le kit écrit la clé et la connexion SQL dans ton server.cfg à chaque démarrage
SYNC_SERVER_CFG=true
; true = vide server-data\cache à chaque démarrage
CLEAR_CACHE_ON_START=false
