# Base de données du mode Docker (DB_MODE=docker)
# Les valeurs ${...} viennent de config.ini quand le kit lance Docker.
name: fivem-localhost

services:
  db:
    image: mariadb:11.4
    container_name: fivem-localhost-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-fivem}
      MARIADB_DATABASE: ${DB_NAME:-fivem}
      TZ: Europe/Paris
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Noms de tables insensibles à la casse, comme sous XAMPP / Windows
      - --lower-case-table-names=1
      - --max-allowed-packet=256M
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: fivem-localhost-pma
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-fivem}
      UPLOAD_LIMIT: 512M
    ports:
      - "127.0.0.1:${PMA_PORT:-8080}:80"

volumes:
  db_data:
