# =============================================================
#  server.cfg minimal pour le localhost
#  À utiliser seulement si ta base n'a pas de server.cfg :
#  copie ce fichier dans server-data\ puis adapte la liste des ressources.
# =============================================================

# --- Réseau ---------------------------------------------------
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# --- Clé et base de données -----------------------------------
# Laisse ces 2 lignes telles quelles : 2-DEMARRER.bat les remplit avec config.ini
sv_licenseKey "changeme"
set mysql_connection_string "mysql://root@127.0.0.1:3306/fivem?charset=utf8mb4"

# --- Infos du serveur -----------------------------------------
sv_hostname "Mon serveur - localhost"
sets sv_projectName "Mon serveur"
sets sv_projectDesc "Serveur de développement local"
sets locale "fr-FR"
sv_maxclients 8

# Ne pas apparaître dans la liste publique des serveurs
sv_master1 ""

set onesync on
sv_scriptHookAllowed 0
sv_endpointprivacy true
set steam_webApiKey "none"

# Décommente si ta base demande une version précise du jeu (DLC)
# sv_enforceGameBuild 3258

# --- Ressources -----------------------------------------------
# Ressources de base FiveM (si elles sont dans ton dossier resources)
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure hardcap

# Base de données, puis ton framework et tes scripts
ensure oxmysql
# ensure es_extended
# ensure qb-core
# ensure [mes-scripts]

# --- Permissions ----------------------------------------------
add_ace group.admin command allow
add_ace group.admin command.quit deny
# add_principal identifier.license:TON_LICENSE group.admin
